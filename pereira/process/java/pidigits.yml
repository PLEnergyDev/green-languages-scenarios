name: pidigits
language: java
code: | # https://benchmarksgame-team.pages.debian.net/benchmarksgame/program/pidigits-graalvmaot-5.html
    /* The Computer Language Benchmarks Game
     * https://salsa.debian.org/benchmarksgame-team/benchmarksgame/
     *
     * Contributed by Michael Ganss
     * derived from PHP version that was
     * contributed by Oleksii Prudkyi
     * port from pidigits.lua-5.lua (Mike Pall, Wim Couwenberg)
     * modified by Craig Russell
     *
     * Original C version by Mr Ledrug
     *
     * ported to Java by Piotr Tarsa
     */

    import java.lang.foreign.*;
    import java.lang.invoke.MethodHandle;

    public class Program {
        private static final Arena GLOBAL_ARENA = Arena.global();

        private static final Linker LINKER = Linker.nativeLinker();
        private static final SymbolLookup GMP = SymbolLookup.libraryLookup("libgmp.so", GLOBAL_ARENA);

        // Manually written as jextract didn't extract it.
        // Names and types taken from gmp.h
        private static final MemoryLayout mpz_t = MemoryLayout.structLayout(
                ValueLayout.JAVA_INT.withName("_mp_alloc"),
                ValueLayout.JAVA_INT.withName("_mp_size"),
                ValueLayout.ADDRESS.withName("_mp_d")
        ).withName("__mpz_struct");

        private static final MethodHandle __gmpz_init;
        private static final MethodHandle __gmpz_init_set_si;
        private static final MethodHandle __gmpz_tdiv_q;
        private static final MethodHandle __gmpz_cmp;
        private static final MethodHandle __gmpz_get_si;
        private static final MethodHandle __gmpz_mul_si;
        private static final MethodHandle __gmpz_mul;
        private static final MethodHandle __gmpz_add;

        static {
            __gmpz_init = LINKER.downcallHandle(
                GMP.find("__gmpz_init").orElseThrow(),
                FunctionDescriptor.ofVoid(ValueLayout.ADDRESS));

            __gmpz_init_set_si = LINKER.downcallHandle(
                GMP.find("__gmpz_init_set_si").orElseThrow(),
                FunctionDescriptor.ofVoid(ValueLayout.ADDRESS, ValueLayout.JAVA_LONG));

            __gmpz_tdiv_q = LINKER.downcallHandle(
                GMP.find("__gmpz_tdiv_q").orElseThrow(),
                FunctionDescriptor.ofVoid(ValueLayout.ADDRESS, ValueLayout.ADDRESS, ValueLayout.ADDRESS));

            __gmpz_cmp = LINKER.downcallHandle(
                GMP.find("__gmpz_cmp").orElseThrow(),
                FunctionDescriptor.of(ValueLayout.JAVA_INT, ValueLayout.ADDRESS, ValueLayout.ADDRESS));

            __gmpz_get_si = LINKER.downcallHandle(
                GMP.find("__gmpz_get_si").orElseThrow(),
                FunctionDescriptor.of(ValueLayout.JAVA_LONG, ValueLayout.ADDRESS));

            __gmpz_mul_si = LINKER.downcallHandle(
                GMP.find("__gmpz_mul_si").orElseThrow(),
                FunctionDescriptor.ofVoid(ValueLayout.ADDRESS, ValueLayout.ADDRESS, ValueLayout.JAVA_LONG));

            __gmpz_mul = LINKER.downcallHandle(
                GMP.find("__gmpz_mul").orElseThrow(),
                FunctionDescriptor.ofVoid(ValueLayout.ADDRESS, ValueLayout.ADDRESS, ValueLayout.ADDRESS));

            __gmpz_add = LINKER.downcallHandle(
                GMP.find("__gmpz_add").orElseThrow(),
                FunctionDescriptor.ofVoid(ValueLayout.ADDRESS, ValueLayout.ADDRESS, ValueLayout.ADDRESS));
        }

        @SuppressWarnings("SameParameterValue")
        private static MemorySegment alloc(MemoryLayout typeDescription) {
            return GLOBAL_ARENA.allocate(typeDescription);
        }

        public static void main(String[] args) throws Throwable {
            MemorySegment n1 = alloc(mpz_t),
                    n2 = alloc(mpz_t),
                    d = alloc(mpz_t),
                    u = alloc(mpz_t),
                    v = alloc(mpz_t),
                    w = alloc(mpz_t);
            int k = 1, k2, i = 0;
            var n = Integer.parseInt(args[0]);

            __gmpz_init.invokeExact(u);
            __gmpz_init.invokeExact(v);

            __gmpz_init_set_si.invokeExact(w, 0L);
            __gmpz_init_set_si.invokeExact(n1, 4L);
            __gmpz_init_set_si.invokeExact(n2, 3L);
            __gmpz_init_set_si.invokeExact(d, 1L);

            var outBuf = new StringBuilder();

            for (; ; ) {
                __gmpz_tdiv_q.invokeExact(u, n1, d);
                __gmpz_tdiv_q.invokeExact(v, n2, d);

                if ((int) __gmpz_cmp.invokeExact(u, v) == 0) {
                    outBuf.append((long) __gmpz_get_si.invokeExact(u));
                    i++;
                    if (i % 10 == 0)
                        outBuf.append("\t:").append(i).append("\n");
                    if (i == n)
                        break;

                    // extract
                    __gmpz_mul_si.invokeExact(u, u, -10L);
                    __gmpz_mul.invokeExact(u, d, u);
                    __gmpz_mul_si.invokeExact(n1, n1, 10L);
                    __gmpz_add.invokeExact(n1, n1, u);
                    __gmpz_mul_si.invokeExact(n2, n2, 10L);
                    __gmpz_add.invokeExact(n2, n2, u);
                } else {
                    // produce
                    k2 = k * 2;
                    __gmpz_mul_si.invokeExact(u, n1, (long)(k2 - 1));
                    __gmpz_add.invokeExact(v, n2, n2);
                    __gmpz_mul_si.invokeExact(w, n1, (long)(k - 1));
                    __gmpz_add.invokeExact(n1, u, v);
                    __gmpz_mul_si.invokeExact(u, n2, (long)(k + 2));
                    __gmpz_add.invokeExact(n2, w, u);
                    __gmpz_mul_si.invokeExact(d, d, (long)(k2 + 1));
                    k++;
                }
            }

            if (i % 10 != 0)
                outBuf.append(" ".repeat(10 - n % 10)).append("\t:").append(n).append("\n");

            System.out.print(outBuf);
        }
    }
arguments: [10000]
compile_options: [-server, --enable-preview, --release 25]
