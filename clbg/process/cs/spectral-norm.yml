description: | # https://benchmarksgame-team.pages.debian.net/benchmarksgame/description/spectralnorm.html#spectralnorm
    ## Background
    MathWorld: ["Hundred-Dollar, Hundred-Digit Challenge Problems", Challenge #3.](http://mathworld.wolfram.com/SpectralNorm.html)
    Thanks to Sebastien Loisel for suggesting this task.

    ## How to implement
    We ask that contributed programs not only give the correct result, but also **use the same algorithm** to calculate that result.
    Each program should:
    - calculate the spectral norm of an infinite matrix A, with entries a11=1, a12=1/2, a21=1/3, a13=1/4, a22=1/5, a31=1/6, etc
    - implement 4 separate functions / procedures / methods like the [Java program](https://benchmarksgame-team.pages.debian.net/benchmarksgame/program/spectralnorm-java-1.html)

    **diff** program output N = 100 with this [output file](https://benchmarksgame-team.pages.debian.net/benchmarksgame/download/spectralnorm-output.txt) to check your program output has the correct format, before you [contribute your program.](https://salsa.debian.org/benchmarksgame-team/benchmarksgame/blob/master/README.md)
    Use a larger command line argument (5500) to check program performance.
code: | # https://benchmarksgame-team.pages.debian.net/benchmarksgame/program/spectralnorm-csharpaot-2.html
    /* The Computer Language Benchmarks Game
       https://salsa.debian.org/benchmarksgame-team/benchmarksgame/

       contributed by Isaac Gouy
       parallel by The Anh Tran
       Updated by Alan McGovern
    */

    using System;
    using System.Threading;

    class Program
    {
        public static void Main(String[] args)
        {
            int n = 2500;
            if (args.Length > 0)
                n = Int32.Parse(args[0]);

            Console.WriteLine("{0:f9}", RunGame(n));
        }

        private static double RunGame(int n)
        {
            // create unit vector
            double[] u = new double[n];
            double[] tmp = new double[n];
            double[] v = new double[n];

            for (int i = 0; i < n; i++)
                u[i] = 1.0;

            int nthread = Environment.ProcessorCount;

            Barrier barrier = new Barrier(nthread);
            // objects contain result of each thread
            Approximate[] apx = new Approximate[nthread];

            // thread handle for waiting/joining
            Thread[] threads = new Thread[nthread];

            // create thread and hand out tasks
            int chunk = n / nthread;
            for (int i = 0; i < nthread; i++)
            {
                int r1 = i * chunk;
                int r2 = (i < (nthread - 1)) ? r1 + chunk : n;

                apx[i] = new Approximate(u, v, tmp, r1, r2);
                apx[i].BarrierSync = barrier;
                threads[i] = new Thread(new ThreadStart(apx[i].Evaluate));
                threads[i].Start();
            }

            // collect results
            double vBv = 0, vv = 0;
            for (int i = 0; i < nthread; i++)
            {
                threads[i].Join();

                vBv += apx[i].m_vBv;
                vv += apx[i].m_vv;
            }

            barrier.Dispose();

            return Math.Sqrt(vBv / vv);
        }

        private class Approximate
        {
            internal Barrier? BarrierSync;
            private double[] m_u;
            private double[] m_v;
            private double[] m_tmp;
            private int m_range_begin, m_range_end;

            public double m_vBv = 0, m_vv = 0;

            public Approximate(double[] u, double[] v, double[] tmp, int rbegin, int rend)
            {
                m_u = u;
                m_v = v;
                m_tmp = tmp;

                m_range_begin = rbegin;
                m_range_end = rend;
            }

            public void Evaluate()
            {
                for (int i = 0; i < 10; i++)
                {
                    MultiplyAtAv(m_u, m_tmp, m_v);
                    MultiplyAtAv(m_v, m_tmp, m_u);
                }

                for (int i = m_range_begin; i < m_range_end; i++)
                {
                    m_vBv += m_u[i] * m_v[i];
                    m_vv += m_v[i] * m_v[i];
                }
            }

            /* return element i,j of infinite matrix A */
            private static double eval_A(int i, int j)
            {
                int div = (((i + j) * (i + j + 1) >> 1) + i + 1);
                return 1.0 / div;
            }

            /* multiply vector v by matrix A */
            private void MultiplyAv(double[] v, double[] Av)
            {
                for (int i = m_range_begin; i < m_range_end; i++)
                {
                    double sum = 0.0;
                    for (int j = 0; j < v.Length; j++)
                        sum += eval_A(i, j) * v[j];
                    Av[i] = sum;
                }
            }

            /* multiply vector v by matrix A transposed */
            private void MultiplyAtv(double[] v, double[] Atv)
            {
                for (int i = m_range_begin; i < m_range_end; i++)
                {
                    double sum = 0.0;
                    for (int j = 0; j < v.Length; j++)
                        sum += eval_A(j, i) * v[j];
                    Atv[i] = sum;
                }
            }

            /* multiply vector v by matrix A and then by matrix A transposed */
            private void MultiplyAtAv(double[] v, double[] tmp, double[] AtAv)
            {
                MultiplyAv(v, tmp);
                BarrierSync.SignalAndWait();

                MultiplyAtv(tmp, AtAv);
                BarrierSync.SignalAndWait();
            }
        }
    }
