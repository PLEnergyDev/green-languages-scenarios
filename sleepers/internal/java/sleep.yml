name: sleep
language: java
description: |
    Simple benchmark that sleeps for one second.
    Used for testing framework measurement accuracy.
libgreen: true
code: |
    class Green {
        static { System.loadLibrary("green"); }
        public native long measureStart(String events);
        public native void measureStop(long context);
    }

    public class Program {
        public static void main(String[] args) {
            if (args.length < 2) {
                System.err.println("Usage: <program> <internal_runs> <metrics>");
                System.exit(1);
            }

            int internal_runs = Integer.parseInt(args[0]);
            String metrics = args[1];

            Green green = new Green();

            for (int i = 0; i < internal_runs; i++) {
                try {
                    Thread.sleep(1000);
                } catch (InterruptedException e) {
                    Thread.currentThread().interrupt();
                }
            }
        }
    }
compile_options: [-server]

